<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Hover Video Play</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            gap: 20px;
            padding: 40px;
        }

        .video-container {
            width: 250px;
            height: 400px;
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        /* zoom effect */
        .video-container:hover video {
            transform: scale(1.05);
        }

        /* play icon */
        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            color: white;
            pointer-events: none;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <!-- Video 1 -->
    <div class="video-container">
        <span class="play-icon">▶</span>
        <video class="hover-video" src="video/vdo1.mp4" muted loop></video>
    </div>

    <!-- Video 2 -->
    <div class="video-container">
        <span class="play-icon">▶</span>
        <video class="hover-video" src="video/vdo3.mp4" muted loop></video>
    </div>

    <script>
        const videos = document.querySelectorAll(".hover-video");

        videos.forEach(video => {

            // Hover start
            video.parentElement.addEventListener("mouseenter", () => {
                video.play().catch(err => console.log(err));

                // unmute after slight delay
                setTimeout(() => {
                    video.muted = false;
                }, 300);
            });

            // Hover leave
            video.parentElement.addEventListener("mouseleave", () => {
                video.pause();
                video.muted = true;
                video.currentTime = 0;
            });

            // Click = enable sound permanently
            video.parentElement.addEventListener("click", () => {
                video.muted = false;
                video.play();
            });
        });
    </script>

</body>

</html>
